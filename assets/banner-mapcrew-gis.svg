<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MapCrew</title>
  <desc id="d">MapCrew: AI agents for GIS, shown as a stack of GIS data layers (basemap, raster, polygons, vector) with a gold pin marking the result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131c"/>
      <stop offset="0.6" stop-color="#0b2430"/>
      <stop offset="1" stop-color="#0d3340"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe8d8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.75" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1fb5a0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1fb5a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatG"><stop offset="0" stop-color="#46d17a" stop-opacity="0.95"/><stop offset="1" stop-color="#46d17a" stop-opacity="0"/></radialGradient>
    <radialGradient id="heatY"><stop offset="0" stop-color="#ffd54a" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient>
    <radialGradient id="heatR"><stop offset="0" stop-color="#ff5a4a" stop-opacity="0.95"/><stop offset="1" stop-color="#ff5a4a" stop-opacity="0"/></radialGradient>
    <clipPath id="sq"><rect width="200" height="200"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fe0d0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <path id="contour" d="M-40 340 C 120 280, 280 380, 470 325 S 700 270, 760 345"/>
    <path id="pin" d="M0 0 C -4 -10 -14 -17 -14 -28 A14 14 0 1 1 14 -28 C 14 -17 4 -10 0 0 Z"/>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#halo)"/>

  <g fill="none" stroke="#5fd0c5" stroke-width="1.4" stroke-linecap="round">
    <use href="#contour" transform="translate(0,-120)" stroke-opacity="0.05"/>
    <use href="#contour" transform="translate(0,-90)" stroke-opacity="0.07"/>
    <use href="#contour" transform="translate(0,-60)" stroke-opacity="0.1"/>
    <use href="#contour" transform="translate(0,-30)" stroke-opacity="0.14"/>
    <use href="#contour" stroke-opacity="0.18"/>
    <use href="#contour" transform="translate(0,30)" stroke-opacity="0.12"/>
    <use href="#contour" transform="translate(0,60)" stroke-opacity="0.07"/>
  </g>

  <!-- floor shadow under the stack -->
  <ellipse cx="960" cy="368" rx="150" ry="14" fill="#000" opacity="0.28"/>

  <!-- layer stack -->
  <path d="M848 294 L960 350 L960 360 L848 304 Z" fill="#06121a" opacity="0.85"/><path d="M1072 294 L960 350 L960 360 L1072 304 Z" fill="#0a1d29" opacity="0.85"/><g transform="translate(960,294) matrix(0.56 0.28 -0.56 0.28 0 0) translate(-100,-100)"><g><rect width="200" height="200" fill="#0f3a5c"/><g stroke="#8fd3ff" stroke-opacity="0.28" stroke-width="1" fill="none"><path d="M0 0V200M0 0H200" /><path d="M25 0V200M0 25H200" /><path d="M50 0V200M0 50H200" /><path d="M75 0V200M0 75H200" /><path d="M100 0V200M0 100H200" /><path d="M125 0V200M0 125H200" /><path d="M150 0V200M0 150H200" /><path d="M175 0V200M0 175H200" /><path d="M200 0V200M0 200H200" /></g></g></g><path d="M960 238 L1072 294 L960 350 L848 294 Z" fill="none" stroke="#9fe3ff" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round"/><path d="M848 228 L960 284 L960 294 L848 238 Z" fill="#06121a" opacity="0.85"/><path d="M1072 228 L960 284 L960 294 L1072 238 Z" fill="#0a1d29" opacity="0.85"/><g transform="translate(960,228) matrix(0.56 0.28 -0.56 0.28 0 0) translate(-100,-100)"><g><rect width="200" height="200" fill="#0e3a3a"/><g clip-path="url(#sq)"><circle cx="60" cy="70" r="55" fill="url(#heatG)"/><circle cx="135" cy="120" r="65" fill="url(#heatY)"/><circle cx="75" cy="155" r="45" fill="url(#heatG)"/><circle cx="155" cy="45" r="40" fill="url(#heatY)"/><circle cx="130" cy="125" r="28" fill="url(#heatR)"/></g></g></g><path d="M960 172 L1072 228 L960 284 L848 228 Z" fill="none" stroke="#9fe3ff" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round"/><path d="M848 162 L960 218 L960 228 L848 172 Z" fill="#06121a" opacity="0.85"/><path d="M1072 162 L960 218 L960 228 L1072 172 Z" fill="#0a1d29" opacity="0.85"/><g transform="translate(960,162) matrix(0.56 0.28 -0.56 0.28 0 0) translate(-100,-100)"><g><rect width="200" height="200" fill="#16264a" fill-opacity="0.9"/><g stroke="#0a1426" stroke-width="2.5" stroke-linejoin="round" fill-opacity="0.88"><path d="M20 28 L92 18 L102 82 L40 96 Z" fill="#3fb68b"/><path d="M112 30 L182 40 L172 102 L116 90 Z" fill="#e0a93b"/><path d="M28 120 L96 110 L106 176 L46 184 Z" fill="#7a6de0"/><path d="M120 122 L186 130 L176 186 L126 176 Z" fill="#2fa8d8"/></g></g></g><path d="M960 106 L1072 162 L960 218 L848 162 Z" fill="none" stroke="#9fe3ff" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round"/><path d="M848 96 L960 152 L960 162 L848 106 Z" fill="#06121a" opacity="0.85"/><path d="M1072 96 L960 152 L960 162 L1072 106 Z" fill="#0a1d29" opacity="0.85"/><g transform="translate(960,96) matrix(0.56 0.28 -0.56 0.28 0 0) translate(-100,-100)"><g><rect width="200" height="200" fill="#0d1c38" fill-opacity="0.5"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 22 C 62 60, 40 104, 100 122 S 162 170, 190 190" stroke="#4fc3f7" stroke-width="4"/><path d="M8 152 C 60 122, 92 166, 132 112 S 180 62, 196 40" stroke="#ffe08a" stroke-width="5"/></g><g fill="#ff7a7a" stroke="#0a1426" stroke-width="2"><circle cx="52" cy="62" r="8"/><circle cx="96" cy="100" r="8"/><circle cx="142" cy="70" r="8"/><circle cx="150" cy="150" r="8"/><circle cx="68" cy="150" r="8"/></g></g></g><path d="M960 40 L1072 96 L960 152 L848 96 Z" fill="none" stroke="#9fe3ff" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- vertical probe through the layers -->
  <path d="M974 102 L974 334" stroke="#ffe08a" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="3 6" stroke-linecap="round"/>

  <!-- result pin -->
  <ellipse cx="974" cy="102" rx="11" ry="5" fill="#000" opacity="0.3"/>
  <use href="#pin" transform="translate(974,102) scale(1.3)" fill="url(#gold)" stroke="#0a1426" stroke-width="2"/>
  <circle cx="974" cy="66" r="6" fill="#0a1426"/>

  <!-- layer labels -->
  <g stroke="#9fe3ff" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="2 4" fill="none"><path d="M1078 294 L1108 294" /><path d="M1078 228 L1108 228" /><path d="M1078 162 L1108 162" /><path d="M1078 96 L1108 96" /></g>
  <g font-family="'Inter','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#cfeee8"><text x="1118" y="299">BASEMAP</text><text x="1118" y="233">RASTER</text><text x="1118" y="167">POLYGONS</text><text x="1118" y="101">VECTOR</text></g>

  <!-- navigation arrow mark -->
  <g transform="translate(72,146)">
    <path d="M30 0 L60 62 L30 46 L0 62 Z" fill="url(#gold)"/>
    <path d="M30 0 L60 62 L30 46 Z" fill="#000000" opacity="0.14"/>
  </g>

  <g font-family="'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="82" y="122" font-size="14" font-weight="600" letter-spacing="4.5" fill="#5fd0c5">AI AGENTS FOR GIS</text>
    <text x="158" y="208" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">MapCrew</text>
    <text x="84" y="260" font-size="26" font-weight="500" fill="#d6f1ec">A geospatial question in. A checked map out.</text>
    <text x="84" y="306" font-size="16" font-weight="500" letter-spacing="1.6" fill="#86b9b0">MARKDOWN-FIRST  ·  NO BUILD STEP  ·  OPEN DATA</text>
  </g>

  <rect x="0" y="394" width="1280" height="6" fill="url(#gold)" opacity="0.85"/>
</svg>
